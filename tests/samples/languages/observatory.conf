# Apache example configuration; do not install on a live server.
<VirtualHost *:8080>
    ServerName observatory.example
    DocumentRoot "/srv/observatory/public"
    <Directory "/srv/observatory/public">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    <FilesMatch "\.(json|csv)$">
        Header set Cache-Control "no-store"
    </FilesMatch>
    ErrorLog "logs/observatory-error.log"
</VirtualHost>
