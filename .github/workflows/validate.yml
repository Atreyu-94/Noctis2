name: Validate and package themes
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: pwsh
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.8.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - name: Install pinned Neovim for native runtime tests
        run: ./tooling/install-ci-neovim.ps1
      - run: npm run check
      - run: npm run build
      - run: node ports/vscode/scripts/audit-compatibility.mjs --strict
      - run: git diff --exit-code -- ports/vscode/themes ports/zed/themes ports/neovim/colors ports/neovim/lua/noctis2/generated
      - name: Prepare pinned original Noctis themes and extra TextMate grammars
        run: npm run prepare:languages:upstream
      - name: Compare all original languages across eleven variants
        run: node ports/vscode/scripts/validate-upstream-languages.mjs
      - name: Prepare pinned native language grammars
        run: npm run prepare:languages:native
      - name: Test samples with native Neovim queries
        run: node tooling/validate-native-languages.mjs neovim
      - name: Test samples with Zed queries outside its application
        run: node tooling/validate-native-languages.mjs zed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-language-reports-${{ matrix.os }}
          path: |
            test-results/neovim-language-validation.json
            test-results/zed-language-validation.json
            test-results/native-languages/inputs.json
            test-results/upstream-language-validation.json
          if-no-files-found: error
          retention-days: 14

  package:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          clean: true
          persist-credentials: false
      - name: Require a clean checkout
        run: |
          $status = git status --porcelain --untracked-files=all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($status) { throw 'Packaging requires a clean checkout.' }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.8.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install pinned Neovim for native runtime tests
        run: ./tooling/install-ci-neovim.ps1
      - run: npm run check
      - run: npm run build
      - run: node ports/vscode/scripts/audit-compatibility.mjs --strict
      - name: Verify generated themes and tracked inputs
        run: git diff --exit-code
      - name: Package the VSIX candidate
        run: npm run package:vsix -- --out "$env:RUNNER_TEMP/noctis2.vsix"
      - name: Package native Zed and Neovim resources
        run: npm run package:ports -- "$env:RUNNER_TEMP/native-ports"
      - name: Inspect packaged resources
        run: npm run inspect:vsix -- "$env:RUNNER_TEMP/noctis2.vsix" "$env:RUNNER_TEMP/vsix-report.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: noctis2-vsix-${{ github.sha }}
          path: |
            ${{ runner.temp }}/noctis2.vsix
            ${{ runner.temp }}/vsix-report.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: noctis2-native-ports-${{ github.sha }}
          path: ${{ runner.temp }}/native-ports/*.zip
          if-no-files-found: error
          retention-days: 14
