name: Real semantic providers
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: pwsh
jobs:
  providers:
    name: Semantic tokens (${{ matrix.group }})
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: [web, bundled, python, julia, native, rust, dotnet, jvm, ruby, go, dart]
    env:
      SEMANTIC_OUTPUT: test-results/semantic-ci/${{ matrix.group }}
      SEMANTIC_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.group }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      JULIA_NUM_PRECOMPILE_TASKS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.8.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Restore shared pinned VS Code
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: test-results/semantic-ci-tools/vscode
          key: semantic-editor-win32-x64-${{ hashFiles('ports/vscode/tests/semantic-provider-versions.json', 'ports/vscode/scripts/prepare-semantic-ci.ps1') }}
      - name: Restore provider installations (never captures)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ env.SEMANTIC_OUTPUT }}/extensions
            ${{ env.SEMANTIC_OUTPUT }}/runtimes
            ${{ env.SEMANTIC_OUTPUT }}/profile*/User/globalStorage
          key: semantic-win32-x64-${{ matrix.group }}-${{ hashFiles('ports/vscode/tests/semantic-provider-versions.json', 'ports/vscode/tests/semantic-providers.json', 'ports/vscode/tests/semantic-ci.json', 'ports/vscode/scripts/prepare-semantic-ci.ps1', 'ports/vscode/scripts/capture-semantic-providers.ps1') }}
      - name: Prepare pinned editor, extensions and runtimes
        run: ./ports/vscode/scripts/prepare-semantic-ci.ps1 -Group '${{ matrix.group }}' -OutputDirectory $env:SEMANTIC_OUTPUT
      - name: Capture real LSP tokens in isolated VS Code
        run: |
          $launch = Get-Content "$env:SEMANTIC_OUTPUT/launch.json" -Raw | ConvertFrom-Json
          ./ports/vscode/scripts/capture-semantic-providers.ps1 -Code $launch.code -Extensions $launch.extensions -OutputDirectory $launch.output -Languages $launch.languages -Julia $launch.julia -JetlsDepot $launch.jetlsDepot -RunId $env:SEMANTIC_RUN_ID -MinimumWaitMs $launch.waitMs -HostTimeoutSeconds 2400
      - name: Require fresh tokens and core roles in all eleven variants
        if: ${{ always() && !cancelled() }}
        run: |
          $groups = Get-Content ports/vscode/tests/semantic-ci.json -Raw | ConvertFrom-Json -AsHashtable
          $languages = $groups['${{ matrix.group }}'].languages -join ','
          node ports/vscode/scripts/validate-semantic-providers.mjs --directory $env:SEMANTIC_OUTPUT --languages $languages --run-id $env:SEMANTIC_RUN_ID --strict-pins
      - name: Preserve captures and diagnostics on success or failure
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: semantic-${{ matrix.group }}-${{ github.run_attempt }}
          path: |
            ${{ env.SEMANTIC_OUTPUT }}/preparation.json
            ${{ env.SEMANTIC_OUTPUT }}/capture*.json
            ${{ env.SEMANTIC_OUTPUT }}/validation.json
            ${{ env.SEMANTIC_OUTPUT }}/matrix.md
            ${{ env.SEMANTIC_OUTPUT }}/profile*/logs/**
          if-no-files-found: warn
          retention-days: 14
