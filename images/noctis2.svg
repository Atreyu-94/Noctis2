<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Noctis2</title>
  <desc id="desc">Independent Noctis fork: a large dark teal 2 on a sand-colored planet, surrounded by colorful organic satellites. Inspired by the original Noctis artwork by Liviu Schera.</desc>
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#009cac"/>
      <stop offset="1" stop-color="#40c5d5"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ef6e3e"/>
      <stop offset="1" stop-color="#ee8565"/>
    </linearGradient>
  </defs>
  <!-- Original Noctis palette and orbital motif; new silhouette and numeral for the fork. -->
  <circle cx="256" cy="264" r="216" fill="#e5b781"/>
  <path d="M60 175C80 143 52 112 74 78C98 42 145 49 158 83C171 119 146 140 119 146C94 151 76 158 60 175Z" fill="url(#teal)"/>
  <path d="M278 41C299 9 344 13 372 38C402 65 414 100 405 125C385 106 374 90 362 105C347 127 322 135 297 129C258 120 251 79 278 41Z" fill="url(#coral)"/>
  <circle cx="461" cy="183" r="28" fill="#40cee0"/>
  <circle cx="40" cy="326" r="21" fill="#7060eb"/>
  <circle cx="60" cy="375" r="15" fill="#c99a00"/>
  <circle cx="134" cy="449" r="28" fill="#40e5a2"/>
  <circle cx="325" cy="479" r="15" fill="#10b684"/>
  <path d="M397 383C420 362 452 374 459 400C470 439 439 463 401 459C377 456 373 450 385 440C400 427 376 405 397 383Z" fill="#df80a5"/>
  <!-- The numeral is a path, so its appearance does not depend on installed fonts. -->
  <path d="M166 211C166 158 204 128 258 128C311 128 349 160 349 207C349 241 333 264 296 291L228 340H351V391H161V348L260 272C287 251 298 235 298 215C298 193 283 179 259 179C233 179 218 192 217 216Z" fill="#052529"/>
  <text x="256" y="425" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#052529">Noctis2</text>
</svg>
